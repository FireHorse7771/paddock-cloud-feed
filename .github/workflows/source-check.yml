name: PADDOCK — перевірка джерела

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paddock-source-check
  cancel-in-progress: false

jobs:
  source-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read the public component
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check the independent guards
        run: python -B -X utf8 -m unittest test_cloud_once -v
      - name: Install the source reader
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Read public Pokerbet cards once
        run: python -B -X utf8 cloud_once.py
