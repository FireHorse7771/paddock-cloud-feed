name: PADDOCK — перевірка джерела

on:
  schedule:
    # Together these disjoint schedules run once every five minutes.
    # Only the hourly slot retains raw evidence; other runs still verify it.
    - cron: '2,7,12,22,27,32,37,42,47,52,57 * * * *'
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      check_only:
        description: Check quote-only access without collecting or updating prices
        required: false
        type: boolean
        default: false
      cloudflare_test:
        description: Test the new Cloudflare mirror with the same verified scan
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: paddock-source-check
  cancel-in-progress: false

jobs:
  source-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read the public component
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check the independent guards
        run: python -B -X utf8 -m unittest test_cloud_once -v
      - name: Check the Cloudflare relay guards
        run: python -B -X utf8 -m unittest test_cloudflare_feed test_cloudflare_primary -v
      - name: Check primary Cloudflare quote-only access
        env:
          PADDOCK_CF_FEED_WRITE_KEY: ${{ secrets.PADDOCK_CF_FEED_WRITE_KEY }}
        run: python -B -X utf8 cloudflare_feed.py --check-access
      - name: Install the source reader
        if: ${{ !inputs.check_only }}
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Read public Pokerbet cards once
        if: ${{ !inputs.check_only }}
        run: python -B -X utf8 cloudflare_primary.py --evidence evidence/public-source.zip
      - name: Publish verified quotes to primary Cloudflare
        if: ${{ !inputs.check_only }}
        env:
          PADDOCK_CF_FEED_WRITE_KEY: ${{ secrets.PADDOCK_CF_FEED_WRITE_KEY }}
        run: python -B -X utf8 cloudflare_feed.py --publish --evidence evidence/public-source.zip
      - name: Optional mirror to previous Sites
        if: ${{ !inputs.check_only }}
        continue-on-error: true
        env:
          PADDOCK_FEED_WRITE_KEY: ${{ secrets.PADDOCK_FEED_WRITE_KEY }}
        run: python -B -X utf8 sites_optional_mirror.py --evidence evidence/public-source.zip
      - name: Preserve verified public evidence
        if: ${{ !cancelled() && hashFiles('evidence/public-source.zip') != '' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 * * * *') }}
        uses: actions/upload-artifact@v7
        with:
          name: public-source-${{ github.run_id }}
          path: evidence/public-source.zip
          if-no-files-found: error
          retention-days: 1
